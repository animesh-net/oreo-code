name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: oreo-code-vsix
          path: '*.vsix'
          retention-days: 7

  no-ai-attribution:
    # CLAUDE.md: every commit is authored by a human, with no AI trailers.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log --format=%B "$range" | grep -qiE '^(co-authored-by|co-committed-by):.*(claude|anthropic|copilot|openai|gpt|chatgpt|gemini)'; then
            echo "A commit in this PR carries an AI attribution trailer."
            exit 1
          fi
